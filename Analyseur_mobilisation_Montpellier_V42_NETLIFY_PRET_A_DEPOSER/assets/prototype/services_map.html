<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body,#map{height:100%;margin:0}body{background:#101923;font-family:system-ui}.leaflet-container{background:#eef1f4}
.legend{position:absolute;z-index:1000;right:10px;bottom:10px;background:#0b1726ee;color:white;border:1px solid #31465e;border-radius:10px;padding:9px;font-size:11px;display:grid;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}.line{width:18px;height:4px;display:inline-block;margin-right:5px;border-radius:3px}
</style></head><body><div id="map"></div><div class="legend"><b>Services datés</b>
<span><i class="dot" style="background:#e24"></i>Stations de tram</span>
<span><i class="dot" style="background:#38a"></i>Arrêts de bus</span>
<span><i class="line" style="background:#32a852"></i>Aménagements vélo</span>
<span><i class="dot" style="background:#f0a020"></i>Vélomagg</span>
<span><i class="dot" style="background:#5f46c6"></i>Compteurs vélo</span>
<span><i class="dot" style="background:#b02a37"></i>Chantiers longs gênants</span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../data/services_population.js"></script><script src="../data/iris_montpellier.js"></script><script src="../data/bureau_polygons.js"></script><script>
const map=L.map('map').setView([43.61,3.875],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const SP=window.SERVICES_POPULATION,layers={},colors={'1':'#0057a7','2':'#ef7d00','3':'#7c2b83','4':'#b5121b','5':'#79b82a'};
function add(name,data,opts){layers[name]=L.geoJSON(data,opts).addTo(map)}
for(const line of ['1','2','3','4','5'])add('tram'+line,{type:'FeatureCollection',features:SP.geo.tram_lines.features.filter(f=>String(Math.round(Number(f.properties.num_exploi)))===line)},{style:{color:colors[line],weight:5,opacity:.9}});
add('tramStops',SP.geo.tram_stops,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:4,color:'#fff',weight:1,fillColor:'#e24',fillOpacity:1}),onEachFeature:(f,l)=>l.bindPopup('<b>'+f.properties.descriptio+'</b><br>Lignes '+f.properties.lignes_pas)});
add('busStops',SP.geo.bus_stops,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:2.7,color:'#2676aa',weight:0,fillOpacity:.7}),onEachFeature:(f,l)=>l.bindPopup('<b>'+f.properties.descriptio+'</b><br>Lignes '+f.properties.lignes_pas)});
add('cycle',SP.geo.cycle,{style:{color:'#32a852',weight:2,opacity:.7}});
add('rev',SP.geo.rev,{style:{color:'#00a878',weight:4,opacity:.9,dashArray:'8 5'}});
add('velomagg',SP.geo.velomagg,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:5,color:'#fff',weight:1,fillColor:'#f0a020',fillOpacity:1}),onEachFeature:(f,l)=>l.bindPopup('<b>'+f.properties.nom+'</b><br>'+f.properties.installati)});
add('bikeCounters',SP.geo.bike_counters,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:5,color:'#fff',weight:1,fillColor:'#5f46c6',fillOpacity:1}),onEachFeature:(f,l)=>{
 const d=SP.bike_counters.find(x=>x.serial===String(f.properties.serial))||{};
 l.bindPopup('<b>'+f.properties.name+'</b><br>Compteur '+f.properties.serial+'<br><b>'+Math.round(d.total_2024||0).toLocaleString('fr-FR')+'</b> passages observés en 2024<br>Moyenne : '+Number(d.avg_daily_2024||0).toLocaleString('fr-FR',{maximumFractionDigits:1})+' passages/jour observé');
}});
add('majorWorksPoly',SP.geo.major_works_poly,{style:{color:'#b02a37',weight:2,fillColor:'#d95763',fillOpacity:.24}});
add('majorWorksPoints',SP.geo.major_works_points,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:6,color:'#fff',weight:1,fillColor:'#b02a37',fillOpacity:1}),onEachFeature:(f,l)=>{
 const p=f.properties;
 l.bindPopup('<b>'+p.adresse+'</b><br>'+p.nature+' — '+p.type+'<br>Du '+p.start+' au '+p.end+' ('+p.duration_days+' jours)<br>Circulation : '+(p.incid_circ||'non précisée')+'<br>Stationnement : '+(p.incid_stat||'non précisé'));
}});
let territory=null;
function territoryLayer(level,id){
 if(territory){map.removeLayer(territory);territory=null}
 if(level==='global')return;
 const fc=level==='iris'?window.IRIS_MONTPELLIER:window.bureauPolygons;
 const key=level==='iris'?'code_iris':'bureau';
 const feat=fc.features.find(f=>String(f.properties[key])===String(id));
 if(feat){territory=L.geoJSON(feat,{style:{color:'#111',weight:4,fillColor:'#fff',fillOpacity:.06}}).addTo(map);map.fitBounds(territory.getBounds(),{padding:[20,20]})}
}
window.addEventListener('message',e=>{
 const d=e.data;if(d?.type!=='services-filter')return;
 for(const line of ['1','2','3','4','5']){const l=layers['tram'+line];if(d.lines.includes(line)){if(!map.hasLayer(l))l.addTo(map)}else if(map.hasLayer(l))map.removeLayer(l)}
 territoryLayer(d.level,d.area)
});
parent.postMessage({type:'services-map-ready'},'*');
</script></body></html>
